name: CD

on:
  push:
    branches: [dev, staging, main]

concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to ${{ github.ref_name }}
    runs-on: ubuntu-latest
    needs: ci
    environment: ${{ github.ref_name }}
    steps:
      - name: Set deploy target
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "dir=dev" >> "$GITHUB_OUTPUT"
            echo "app=skillbridge-api-dev" >> "$GITHUB_OUTPUT"
            echo "env_flag=dev" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            echo "dir=staging" >> "$GITHUB_OUTPUT"
            echo "app=skillbridge-api-staging" >> "$GITHUB_OUTPUT"
            echo "env_flag=staging" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "dir=production" >> "$GITHUB_OUTPUT"
            echo "app=skillbridge-api-prod" >> "$GITHUB_OUTPUT"
            echo "env_flag=production" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unknown branch '${{ github.ref_name }}' — expected 'dev', 'staging', or 'main'"
            exit 1
          fi

      - name: Validate environment file secret
        env:
          DEV_ENV_FILE: ${{ secrets.DEV_ENV_FILE }}
          STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE }}
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "dev" ]; then
            ENV_FILE="$DEV_ENV_FILE"
            SECRET_NAME="DEV_ENV_FILE"
          elif [ "$BRANCH" = "staging" ]; then
            ENV_FILE="$STAGING_ENV_FILE"
            SECRET_NAME="STAGING_ENV_FILE"
          elif [ "$BRANCH" = "main" ]; then
            ENV_FILE="$PRODUCTION_ENV_FILE"
            SECRET_NAME="PRODUCTION_ENV_FILE"
          fi
          if [ -z "$ENV_FILE" ]; then
            echo "::error::$SECRET_NAME secret is empty or unset. Add it under Settings → Environments → $BRANCH → Secrets → $SECRET_NAME."
            exit 1
          fi
          echo "$SECRET_NAME is set"
          {
            echo "DOTENV<<__SB_API_DOTENV__"
            echo "$ENV_FILE"
            echo "__SB_API_DOTENV__"
          } >> "$GITHUB_ENV"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DOTENV: ${{ env.DOTENV }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DOTENV
          script: |
            set -euo pipefail

            DEPLOY_DIR="$HOME/skillbridge/backend/${{ steps.target.outputs.dir }}"
            APP_NAME="${{ steps.target.outputs.app }}"
            ENV_FLAG="${{ steps.target.outputs.env_flag }}"
            REPO="https://github.com/${{ github.repository }}.git"
            BRANCH="${{ github.ref_name }}"

            if [ -z "$DOTENV" ]; then
              echo "FATAL: env payload is empty"
              exit 1
            fi

            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            if [ ! -d ".git" ]; then
              git clone --branch "$BRANCH" "$REPO" .
            else
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
            fi

            printf '%s\n' "$DOTENV" > .env
            chmod 600 .env

            pnpm install --frozen-lockfile
            pnpm build

            DATABASE_NAME=$(grep -E '^DATABASE_NAME=' .env | sed 's/^[^=]*=//' | tr -d '\r')
            DATABASE_USER=$(grep -E '^DATABASE_USER=' .env | sed 's/^[^=]*=//' | tr -d '\r')
            DATABASE_HOST=$(grep -E '^DATABASE_HOST=' .env | sed 's/^[^=]*=//' | tr -d '\r')
            DATABASE_PORT=$(grep -E '^DATABASE_PORT=' .env | sed 's/^[^=]*=//' | tr -d '\r')
            DATABASE_PASSWORD=$(grep -E '^DATABASE_PASSWORD=' .env | sed 's/^[^=]*=//' | tr -d '\r')

            if [ -z "$DATABASE_NAME" ]; then
              echo "FATAL: DATABASE_NAME is empty in ENV_FILE"
              exit 1
            fi

            DATABASE_NAME_SQL=$(printf '%s' "$DATABASE_NAME" | sed "s/'/''/g")
            if PGPASSWORD="$DATABASE_PASSWORD" psql -h "$DATABASE_HOST" -p "${DATABASE_PORT:-5432}" -U "$DATABASE_USER" -d postgres -tc \
              "SELECT 1 FROM pg_database WHERE datname = '$DATABASE_NAME_SQL'" | grep -q 1; then
              echo "Database $DATABASE_NAME already exists"
            else
              PGPASSWORD="$DATABASE_PASSWORD" createdb -h "$DATABASE_HOST" -p "${DATABASE_PORT:-5432}" -U "$DATABASE_USER" "$DATABASE_NAME"
            fi

            pnpm migration:run

            export PM2_APP_NAME="$APP_NAME"

            if pm2 describe "$APP_NAME" > /dev/null 2>&1; then
              pm2 restart ecosystem.config.cjs --only "$APP_NAME" --env "$ENV_FLAG" --update-env
            else
              pm2 start ecosystem.config.cjs --only "$APP_NAME" --env "$ENV_FLAG"
            fi
            pm2 save
